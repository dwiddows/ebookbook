% make4ht configuration for the epub: "make4ht -c lib/ebook-layout.cfg ..." (see build.sh).
\Preamble{xhtml}
% Image widths as a percentage of the text width (at most 100%), so
% width=0.5\linewidth fills half the screen. tex4ht's default is a fixed size in
% pixels, which makes images small on a Kindle.
\makeatletter
\Configure{Gin-dim}{style="width:\fpeval{min(100,round(\Gin@req@width/\linewidth*100,1))}\@percentchar"}
\makeatother
\begin{document}
% Full-width figures with lightly inset captions and a compact vertical gap.
\Css{figure.figure, figure.float {margin-left:0; margin-right:0;}}
\Css{figcaption.caption {margin-left:0.5em; margin-right:0.5em; margin-top:0.35em; text-indent:0; text-align:left;}}
% Contents: chapter entries at normal line spacing (tex4ht's default is 200%).
\Css{.chapterToc a, .chapterToc, .likechapterToc a, .likechapterToc {line-height:1.3;}}
\EndPreamble
